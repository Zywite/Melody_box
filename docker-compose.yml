services:
  nginx:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/app/frontend/dist:ro
      - music_data:/app/data/music:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: melodybox
      POSTGRES_PASSWORD: melodybox
      POSTGRES_DB: melodybox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melodybox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://melodybox:melodybox@db:5432/melodybox
      SECRET_KEY: change-me-in-production
      ALLOWED_ORIGINS: http://localhost:8001
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - frontend_dist:/app/frontend/dist
      - music_data:/app/data/music
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://melodybox:melodybox@db:5432/melodybox
      SECRET_KEY: change-me-in-production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PYTHONPATH: /app/src
    volumes:
      - music_data:/app/data/music
    command: arq worker.WorkerSettings
    restart: unless-stopped

volumes:
  pgdata:
  music_data:
  frontend_dist:
