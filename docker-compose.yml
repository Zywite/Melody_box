services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: melodybox
      POSTGRES_PASSWORD: melodybox
      POSTGRES_DB: melodybox
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melodybox"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://melodybox:melodybox@db:5432/melodybox
      SECRET_KEY: change-me-in-production
      ALLOWED_ORIGINS: http://localhost:8001
    volumes:
      - music_data:/app/data/music
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  pgdata:
  music_data:
